<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laporan Radiologi - Rumkit Palangkaraya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-from: #1a0000;
            --bg-to: #8b0000;
            --glass-bg: rgba(255,255,255,0.06);
            --glass-card: rgba(255,255,255,0.09);
            --glass-input: rgba(255,255,255,0.11);
            --glass-border: rgba(255,255,255,0.16);
            --text-main: #ffffff;
            --text-muted: rgba(255,255,255,0.52);
            --primary: #ef4444;
            --primary-dark: #b91c1c;
            --danger: #f87171;
            --success: #34d399;
            --accent: #2a0a0a;
            --radius-main: 24px;
            --radius-card: 18px;
            --radius-input: 12px;
            --fab-bottom: 35px;
            --fab-right: 35px;
            --fab-height: 54px;
        }

        html { height: 100%; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(20px + 80px);
            position: relative;
        }

        .star-bg {
            position: fixed;
            inset: 0;
            background: #8b0000;
            background: -webkit-linear-gradient(to right, #1a0000, #8b0000);
            background: linear-gradient(to right, #1a0000, #8b0000);
            z-index: -3;
        }

        .stars-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
        }

        .stars-layer canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

        .nebula {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 70% 50% at 20% 30%, rgba(239,68,68,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 80% 70%, rgba(69,10,10,0.14) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 50% 10%, rgba(26,0,0,0.20) 0%, transparent 60%);
        }

        .app-wrap {
            width: 100%;
            max-width: 600px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-main);
            padding: 24px;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow:
                0 8px 40px rgba(139,0,0,0.20),
                0 2px 80px rgba(26,0,0,0.15),
                inset 0 1px 0 rgba(255,255,255,0.18);
            transform: translateZ(0);
            will-change: transform;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .app-wrap::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(239,68,68,0.6), rgba(69,10,10,0.6), transparent);
            border-radius: 100%;
        }

        @media (min-width: 1024px) {
            body { padding: 32px; align-items: center; }
            .app-wrap {
                max-width: 1100px;
                padding: 40px;
                margin: 0 auto;
                overflow: visible;
            }
            .main-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 40px;
                align-items: start;
            }
            .panel-right { position: sticky; top: 40px; }
            #hasil-laporan { min-height: 400px; max-height: calc(100vh - 200px); }
        }

        @media (max-width: 1023px) {
            .btn-row { flex-direction: column; gap: 10px; }
            .action-btn { padding: 16px 12px; font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .app-wrap { padding: 16px; border-radius: 20px; }
            .fab-speed-dial { bottom: 20px; right: 16px; }
        }

        .header-logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
        }

        .header-logo-wrap img {
            height: 75px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 16px rgba(239,68,68,0.55));
        }

        .header-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-section, .kategori-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 16px;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .form-section:hover, .kategori-card:hover {
            border-color: rgba(239,68,68,0.28);
            box-shadow: 0 4px 20px rgba(239,68,68,0.08);
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1.1px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: ''; flex: 1; height: 1px; background: rgba(239,68,68,0.20);
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        /* Fix iOS Zoom issue by using font-size 16px minimum */
        select, input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            background: var(--glass-input);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-input);
            font-size: 16px; 
            color: #fff;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        select:focus, input[type="date"]:focus {
            border-color: rgba(239,68,68,0.6);
            box-shadow: 0 0 0 3px rgba(239,68,68,0.15);
        }

        select option { background-color: #200606; color: #ffffff; font-size: 16px; }

        .petugas-row {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .kategori-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #fff;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(239,68,68,0.35);
        }

        .counter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .counter-item { display: flex; flex-direction: column; gap: 8px; }

        .sub-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .counter-controls {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px; padding: 6px;
        }

        /* Improved Touch Target for mobile buttons */
        .btn-step {
            width: 40px; height: 40px; border-radius: 10px; border: none;
            background: rgba(255,255,255,0.10); color: #fff;
            font-weight: 700; font-size: 1.2rem; cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-step:active { background: rgba(239,68,68,0.35); transform: scale(0.92); }

        .val-display { font-weight: 800; font-size: 1.1rem; color: #fff; min-width: 24px; text-align: center; }

        #hasil-laporan {
            background: rgba(20,4,4,0.68);
            border: 1px solid rgba(239,68,68,0.18);
            border-radius: var(--radius-card);
            color: #fca5a5;
            padding: 24px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-y: auto;
            max-height: 70vh;
            -webkit-overflow-scrolling: touch;
            cursor: text;
            box-shadow: inset 0 2px 20px rgba(139,0,0,0.10);
            margin-bottom: 16px;
        }

        .btn-row { display: flex; gap: 12px; }

        .action-btn {
            flex: 1; padding: 16px 12px; border: none; border-radius: var(--radius-input);
            font-size: 0.95rem; font-weight: 700; cursor: pointer; color: #fff;
            transition: transform 0.12s ease, filter 0.2s ease, box-shadow 0.2s ease;
        }

        .action-btn:active { transform: scale(0.97); filter: brightness(0.9); }

        .btn-copy { background: linear-gradient(135deg, #b91c1c, #1a1a1a); box-shadow: 0 4px 16px rgba(139,0,0,0.35); }
        .btn-wa { background: linear-gradient(135deg, #25d366, #1aaa52); box-shadow: 0 4px 16px rgba(37,211,102,0.28); }

        .btn-clear {
            width: 100%; padding: 16px; margin-top: 16px;
            border: 1px solid rgba(248,113,113,0.25); border-radius: var(--radius-input);
            background: rgba(248,113,113,0.08); color: var(--danger);
            font-weight: 700; font-size: 0.95rem; cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn-clear:hover { background: rgba(248,113,113,0.16); }

        .fab-speed-dial { position: fixed; bottom: var(--fab-bottom); right: var(--fab-right); z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
        .fab-menu-items { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; opacity: 0; transform: translateY(10px) scale(0.95); pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; }
        .fab-speed-dial.open .fab-menu-items { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        
        .fab-menu-item { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; }
        .fab-menu-label { background: rgba(20,4,4,0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff; font-size: 0.85rem; font-weight: 600; padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(239,68,68,0.22); box-shadow: 0 4px 14px rgba(139,0,0,0.25); }
        .fab-menu-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.22); flex-shrink: 0; transition: transform 0.15s ease; }
        .fab-menu-icon.blue { background: linear-gradient(135deg, #b91c1c, #1a1a1a); }
        .fab-menu-icon.green { background: linear-gradient(135deg, #25d366, #1aaa52); }

        .fab-main-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent)); border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); height: 60px; width: auto; border-radius: 30px;
            display: flex; align-items: center; justify-content: center; color: white;
            box-shadow: 0 8px 28px rgba(239,68,68,0.4), 0 2px 8px rgba(26,0,0,0.25); padding: 0 24px; gap: 10px; cursor: pointer;
            font-size: 1rem; font-weight: 700; transition: all 0.2s ease;
        }
        .fab-speed-dial.open .fab-main-btn { border-radius: 50%; width: 60px; padding: 0; justify-content: center; }
        .fab-speed-dial.open .fab-toggle-text { display: none; }
        .fab-speed-dial.open .fab-toggle-icon { transform: rotate(45deg); }

        .toast-notification {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(20,4,4,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(239,68,68,0.28); padding: 14px 28px; border-radius: 30px;
            color: #fff; font-size: 0.9rem; font-weight: 600;
            transition: top 0.5s cubic-bezier(0.68,-0.55,0.265,1.55); z-index: 99999; pointer-events: none;
            box-shadow: 0 8px 28px rgba(239,68,68,0.25);
        }
        .toast-notification.show { top: 32px; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 100000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 30px; text-align: center; max-width: 90%; width: 340px;
            box-shadow: 0 10px 40px rgba(139,0,0,0.3); transform: scale(0.9); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-title { color: #fff; font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; }
        .modal-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .modal-actions { display: flex; gap: 12px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; color: white;}
        .btn-cancel { background: rgba(255,255,255,0.1); }
        .btn-confirm { background: var(--primary); }

        .dt-widget {
            position: relative; display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap; border: 1px solid rgba(239,68,68,0.22); border-radius: 16px;
            padding: 16px 20px; cursor: pointer; overflow: hidden;
            background: radial-gradient(circle at 100% 0%, rgba(239,68,68,0.16) 0%, transparent 55%), rgba(20,4,4,0.55);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        .dt-widget:hover { border-color: rgba(239,68,68,0.42); }
        .dt-widget:active { transform: scale(0.98); }

        .dt-native-input {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%; opacity: 0; /* Changed from 0.01 to 0 for better hidden behavior */
            cursor: pointer; z-index: 5;
            -webkit-appearance: none; appearance: none;
            background: transparent; color: transparent; border: none;
            /* Ensure the input covers the whole area */
            display: block; 
        }

        .dt-left { display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
        .dt-figure { display: flex; align-items: flex-start; font-family: 'Oswald', system-ui, sans-serif; line-height: 0.82; }
        .dt-num { font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 700; color: #fff; }
        .dt-num-sm { font-weight: 400; color: rgba(255,255,255,0.72); }
        .dt-sep { font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 300; color: rgba(255,255,255,0.32); margin: 0 4px; align-self: center; }
        .dt-dow { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 0.7rem; font-weight: 700; color: var(--primary); background: rgba(239,68,68,0.16); padding: 4px 8px; border-radius: 8px; margin: 2px 0 0 10px; }
        .dt-caption { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        
        .dt-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
        .dt-clock-wrap { display: flex; align-items: baseline; gap: 4px; font-family: 'Oswald', system-ui, sans-serif; }
        .dt-clock { font-size: 1.4rem; font-weight: 600; color: #fff; }
        .dt-sec { font-size: 0.85rem; color: rgba(255,255,255,0.4); }
        
        .dt-status-row { display: flex; align-items: center; gap: 8px; }
        .dt-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; animation: dtPulse 1.8s ease-out infinite; }
        
        @keyframes dtPulse {
            0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.55); }
            70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); }
            100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
        }

        .dt-edit-hint { font-size: 0.7rem; color: rgba(255,255,255,0.5); }
        
        .dt-live-btn {
            position: relative; z-index: 10; pointer-events: auto;
            background: rgba(251,191,36,0.14); border: 1px solid rgba(251,191,36,0.35);
            color: #fbbf24; font-size: 0.7rem; font-weight: 700; padding: 4px 10px;
            border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="star-bg"></div>
<div class="stars-layer"><canvas id="starCanvas"></canvas></div>
<div class="nebula"></div>

<div class="fab-speed-dial" id="fabDial">
    <div class="fab-menu-items">
        <a href="#" class="fab-menu-item" onclick="event.preventDefault()">
            <span class="fab-menu-label">Pembuat Hasil Bacaan Radiologi</span>
            <div class="fab-menu-icon blue">📋</div>
        </a>
        <a href="#" class="fab-menu-item" onclick="event.preventDefault()">
            <span class="fab-menu-label">Pembuat Hasil CBCT</span>
            <div class="fab-menu-icon green">📄</div>
        </a>
    </div>
    <button class="fab-main-btn" onclick="toggleFab()" aria-label="Buka Menu">
        <span class="fab-toggle-icon">＋</span>
        <span class="fab-toggle-text">Menu</span>
    </button>
</div>

<div id="toastNotif" class="toast-notification">
    <span>✓ Laporan Berhasil Disalin!</span>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-card">
        <div class="modal-title">Reset Data?</div>
        <div class="modal-desc">Semua jumlah pasien akan dikembalikan ke angka 0.</div>
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closeModal()">Batal</button>
            <button class="modal-btn btn-confirm" onclick="confirmReset()">Ya, Reset</button>
        </div>
    </div>
</div>

<div class="app-wrap">
    <div class="header-logo-wrap">
        <!-- Using a placeholder to simulate the logo -->
        <img src="https://placehold.co/100x100/1a0000/ef4444?text=Radiologi" alt="Logo Radiologi" style="border-radius: 50%;">
        <div class="header-title">Radiologi Rumkit TNI AD Palangkaraya</div>
        <div class="subtitle">Sistem Laporan Serah Terima Dinas</div>
    </div>

    <div class="main-grid">
        <div class="panel-left">
            <div class="form-section">
                <div class="section-title">Waktu &amp; Tanggal</div>
                
                <div class="dt-widget" id="dtWidget" onclick="openDatePicker(event)">
                    <!-- The input is placed securely inside the widget block first to ensure it layers over the rest in some DOM flows if needed, though z-index handles most -->
                    <input type="date" id="tgl" class="dt-native-input" onchange="onTglManualChange()" aria-label="Ubah tanggal laporan">
                    
                    <div class="dt-left">
                        <div class="dt-figure">
                            <span class="dt-num" id="dtDay">17</span><span class="dt-sep">/</span><span class="dt-num dt-num-sm" id="dtMonth">08</span>
                            <span class="dt-dow" id="dtDow">SEN</span>
                        </div>
                        <div class="dt-caption">
                            <span id="dtFullDate">17/08/2026</span>
                        </div>
                    </div>
                    <div class="dt-right">
                        <div class="dt-clock-wrap">
                            <span class="dt-clock" id="dtClock">00:00</span><span class="dt-sec" id="dtSec">:00</span>
                        </div>
                        <div class="dt-status-row">
                            <span class="dt-live-dot" id="dtLiveDot"></span>
                            <span class="dt-edit-hint" id="dtEditHint">Live &#8226; ketuk u/ ubah</span>
                            <button type="button" class="dt-live-btn" id="dtLiveBtn" style="display:none;" onclick="resetToLive(event)">&#8635; Live</button>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 16px;">
                    <label>Salam</label>
                    <select id="salam" onchange="gen()">
                        <option value="otomatis">Auto (Menyesuaikan Waktu)</option>
                        <option value="Selamat pagi">Selamat Pagi</option>
                        <option value="Selamat siang">Selamat Siang</option>
                        <option value="Selamat malam">Selamat Malam</option>
                    </select>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">Petugas Dinas</div>
                <label>Dinas Sebelumnya (Menyerahkan)</label>
                <div class="petugas-row">
                    <select id="p1" onchange="gen()">
                        <option value="PELTU Alfried">PELTU Alfried</option>
                        <option value="SUKWAN Dian">SUKWAN Dian</option>
                        <option value="SUKWAN Jo">SUKWAN Jo</option>
                        <option value="SUKWAN Algie">SUKWAN Algie</option>
                    </select>
                    <select id="s1" onchange="gen()">
                        <option value="Pagi">Pagi</option>
                        <option value="Siang">Siang</option>
                        <option value="Malam">Malam</option>
                    </select>
                </div>
                
                <label>Dinas Saat Ini (Menerima)</label>
                <div class="petugas-row">
                    <select id="p2" onchange="gen()">
                        <option value="SUKWAN Dian">SUKWAN Dian</option>
                        <option value="PELTU Alfried">PELTU Alfried</option>
                        <option value="SUKWAN Jo">SUKWAN Jo</option>
                        <option value="SUKWAN Algie">SUKWAN Algie</option>
                    </select>
                    <select id="s2" onchange="gen()">
                        <option value="Siang">Siang</option>
                        <option value="Pagi">Pagi</option>
                        <option value="Malam">Malam</option>
                    </select>
                </div>
            </div>

            <div id="pasien-inputs"></div>
            <button class="btn-clear" onclick="requestReset()">&#8635; Reset Data Pasien</button>
        </div>

        <div class="panel-right">
            <div id="hasil-laporan" onclick="selAll()"></div>
            <div class="btn-row">
                <button class="action-btn btn-copy" onclick="doKopi()">&#128203; Salin Laporan</button>
                <button class="action-btn btn-wa" onclick="doWA()">&#128232; Kirim WA</button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    var canvas = document.getElementById('starCanvas');
    var ctx = canvas.getContext('2d');
    var stars = [];
    var mouse = { x: 0, y: 0 };
    var W, H;

    function resize() {
        W = canvas.width = window.innerWidth || 800;
        H = canvas.height = window.innerHeight || 600;
    }

    function randomStar() {
        return {
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.4 + 0.3,
            alpha: Math.random() * 0.7 + 0.2,
            speed: Math.random() * 0.015 + 0.005,
            phase: Math.random() * Math.PI * 2,
            layer: Math.floor(Math.random() * 3)
        };
    }

    function initStars(count) {
        stars = [];
        for (var i = 0; i < count; i++) stars.push(randomStar());
    }

    resize();
    initStars(280);
    window.addEventListener('resize', function() { resize(); initStars(280); });

    window.addEventListener('mousemove', function(e) {
        if (W && H) {
            mouse.x = (e.clientX / W - 0.5) * 2;
            mouse.y = (e.clientY / H - 0.5) * 2;
        }
    });

    window.addEventListener('touchmove', function(e) {
        if (e.touches.length && W && H) {
            mouse.x = (e.touches[0].clientX / W - 0.5) * 2;
            mouse.y = (e.touches[0].clientY / H - 0.5) * 2;
        }
    }, { passive: true });

    var depthFactor = [4, 9, 16];
    var t = 0;

    function draw() {
        if (!W || !H || isNaN(W) || isNaN(H)) {
            resize();
        }
        ctx.clearRect(0, 0, W, H);
        t += 0.016;
        stars.forEach(function(s) {
            var twinkle = s.alpha * (0.6 + 0.4 * Math.sin(t * s.speed * 60 + s.phase));
            var df = depthFactor[s.layer];
            var ox = mouse.x * df;
            var oy = mouse.y * df;
            var sx = (s.x + ox + W * 2) % W;
            var sy = (s.y + oy + H * 2) % H;

            if (isNaN(sx) || isNaN(sy) || !isFinite(sx) || !isFinite(sy)) {
                return;
            }

            if (s.layer === 2) {
                ctx.beginPath();
                var radius = Math.max(0.1, s.r * 3.5);
                var grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, radius);
                grd.addColorStop(0, 'rgba(252,165,165,' + (twinkle * 0.55) + ')');
                grd.addColorStop(1, 'rgba(252,165,165,0)');
                ctx.arc(sx, sy, radius, 0, Math.PI * 2);
                ctx.fillStyle = grd;
                ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(sx, sy, Math.max(0.1, s.r), 0, Math.PI * 2);
            var colors = ['rgba(255,255,255,', 'rgba(252,165,165,', 'rgba(220,38,38,'];
            ctx.fillStyle = colors[s.layer] + twinkle + ')';
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
})();

function toggleFab() { document.getElementById('fabDial').classList.toggle('open'); }
document.addEventListener('click', function(e) {
    var dial = document.getElementById('fabDial');
    if (!dial.contains(e.target)) dial.classList.remove('open');
});

var kat = ["Militer", "PNS", "KBT", "Masyarakat Umum", "RO Gigi"];
var sub = ["BPJS", "Umum", "MCU", "Jasa Raharja"];

function getJakartaNow() {
    return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));
}

function getCurrentShift() {
    var h = getJakartaNow().getHours();
    if (h >= 7 && h < 14) return 'Pagi';
    if (h >= 14 && h < 19) return 'Siang';
    return 'Malam';
}

function getPreviousShift(shift) {
    var shifts = ['Pagi', 'Siang', 'Malam'];
    var idx = shifts.indexOf(shift);
    if (idx === -1) return 'Malam';
    return shifts[(idx - 1 + 3) % 3];
}

function setShifts() {
    var currentShift = getCurrentShift();
    document.getElementById('s2').value = currentShift;
    document.getElementById('s1').value = getPreviousShift(currentShift);
}

function initDate() {
    var n = getJakartaNow();
    var y = n.getFullYear();
    var m = String(n.getMonth() + 1).padStart(2, '0');
    var d = String(n.getDate()).padStart(2, '0');
    document.getElementById('tgl').value = y + '-' + m + '-' + d;
    setShifts();
}

var dateManuallySet = false;
var hariSingkat = ["MIN","SEN","SEL","RAB","KAM","JUM","SAB"];

function updateDateWidget() {
    var v = document.getElementById('tgl').value;
    if (!v) return;
    var p = v.split('-'); 
    var y = p[0], m = p[1], d = p[2];
    var dt = new Date(+y, +m - 1, +d);

    document.getElementById('dtDay').innerText = parseInt(d, 10);
    document.getElementById('dtMonth').innerText = m;
    document.getElementById('dtDow').innerText = hariSingkat[dt.getDay()];
    document.getElementById('dtFullDate').innerText = d + '/' + m + '/' + y;
}

// Function stopPropagation removed as it was preventing the native input click behavior

// Programmatic trigger for non-iOS devices (PC/Android)
function openDatePicker(e) {
    // If clicking on the reset to live button, ignore.
    if (e.target.closest('#dtLiveBtn')) return;
    
    var tgl = document.getElementById('tgl');
    try {
        if (typeof tgl.showPicker === 'function') {
            tgl.showPicker();
        } else {
            // Focus and click are often enough for fallback
            tgl.focus();
            // Don't call tgl.click() here if the event target is already the input, 
            // otherwise it might cause infinite loops or duplicate triggers on some mobile browsers
            if(e.target !== tgl) {
                tgl.click();
            }
        }
    } catch (err) {
        tgl.focus();
    }
}

function onTglManualChange() {
    dateManuallySet = true;
    document.getElementById('dtEditHint').innerText = 'Manual \u2022 ketuk u/ ubah';
    document.getElementById('dtLiveDot').style.display = 'none';
    document.getElementById('dtLiveBtn').style.display = 'inline-block';
    gen();
}

function resetToLive(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    dateManuallySet = false;
    document.getElementById('dtEditHint').innerText = 'Live \u2022 ketuk u/ ubah';
    document.getElementById('dtLiveDot').style.display = 'block';
    document.getElementById('dtLiveBtn').style.display = 'none';
    syncNow();
}

function syncNow() {
    var jkt = getJakartaNow();
    var hm = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', hour12: false, hour: '2-digit', minute: '2-digit' }).format(new Date());
    var ss = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', second: '2-digit' }).format(new Date());
    
    document.getElementById('dtClock').innerText = hm;
    document.getElementById('dtSec').innerText = ':' + ss;

    if (!dateManuallySet) {
        var y = jkt.getFullYear();
        var m = String(jkt.getMonth() + 1).padStart(2, '0');
        var d = String(jkt.getDate()).padStart(2, '0');
        var todayStr = y + '-' + m + '-' + d;
        var tglEl = document.getElementById('tgl');
        if (tglEl.value !== todayStr) {
            tglEl.value = todayStr;
            gen(); 
        } else {
            updateDateWidget();
        }
    }
}

function chg(id, d) {
    var el = document.getElementById(id);
    var v = (parseInt(el.value) || 0) + d;
    if (v < 0) v = 0;
    el.value = v;
    document.getElementById('dsp-' + id).innerText = v;
    gen();
}

(function buildInputs() {
    var c = document.getElementById('pasien-inputs');
    kat.forEach(function(k, i) {
        var div = document.createElement('div');
        div.className = 'kategori-card';
        var grid = '';
        sub.forEach(function(s) {
            var id = s.replace(/\s+/g,'-') + '-' + i;
            grid += '<div class="counter-item">' +
                '<div class="sub-label">' + s + '</div>' +
                '<div class="counter-controls">' +
                '<button class="btn-step" onclick="chg(\'' + id + '\',-1)">−</button>' +
                '<span class="val-display" id="dsp-' + id + '">0</span>' +
                '<button class="btn-step" onclick="chg(\'' + id + '\',1)">+</button>' +
                '<input type="hidden" id="' + id + '" class="ip" value="0">' +
                '</div></div>';
        });
        div.innerHTML = '<div class="kategori-title"><span class="badge">' + (i+1) + '</span>' + k + '</div>' +
            '<div class="counter-grid">' + grid + '</div>';
        c.appendChild(div);
    });
})();

function fmtTgl(s) {
    if (!s) return '';
    var p = s.split('-');
    var hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    var bln  = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    var dt = new Date(+p[0], +p[1]-1, +p[2]);
    return hari[dt.getDay()] + ', ' + parseInt(p[2]) + ' ' + bln[+p[1]-1] + ' ' + p[0];
}

function getLaporan() {
    var sv  = document.getElementById('salam').value;
    var tgl = fmtTgl(document.getElementById('tgl').value);
    var p1  = document.getElementById('p1').value;
    var s1  = document.getElementById('s1').value;
    var p2  = document.getElementById('p2').value;
    var s2  = document.getElementById('s2').value;
    var sf  = sv;

    if (sv === 'otomatis') {
        var h = getJakartaNow().getHours();
        sf = (h >= 0 && h < 11) ? 'Selamat Pagi' : (h >= 11 && h < 15) ? 'Selamat Siang' : 'Selamat Malam';
    }

    var total = 0, detail = '';
    kat.forEach(function(k, i) {
        var items = [], counts = 0;
        sub.forEach(function(s) {
            var v = parseInt(document.getElementById(s.replace(/\s+/g,'-') + '-' + i).value) || 0;
            if (v > 0) { items.push(v + ' orang (' + s + ')'); counts += v; }
        });
        total += counts;
        var ket = items.length > 0 ? items.join('\n                    ') : 'nihil';
        detail += (i+1) + '. ' + k.padEnd(14) + ': ' + ket + '\n';
    });

    return 'Kepada\nYth. Karumkit Tk. IV 12.07.03 Palangkaraya\n\n' + sf +
        '\nIjin melaporkan serah terima Dinas Radiologi Rumkit TNI AD\n*' + tgl + '*\n\nSebagai berikut :\n *Dinas ' +
        s1 + '*\n  ' + p1 + '\n\n *Dinas ' + s2 + '*\n  ' + p2 + '\n\nJumlah pasien : ' + total +
        ' orang\n\nKeterangan : \n' + detail +
        '\nRumkit TNI-AD dalam keadaan aman, sekian laporan selesai, Terimakasih.';
}

function gen() {
    updateDateWidget();
    document.getElementById('hasil-laporan').innerText = getLaporan();
}

function selAll() {
    var n = document.getElementById('hasil-laporan');
    var sel = window.getSelection();
    var r = document.createRange();
    r.selectNodeContents(n);
    sel.removeAllRanges();
    sel.addRange(r);
}

function requestReset() { document.getElementById('confirmModal').classList.add('active'); }
function closeModal() { document.getElementById('confirmModal').classList.remove('active'); }

function confirmReset() {
    document.querySelectorAll('.ip').forEach(function(el) {
        el.value = 0;
        document.getElementById('dsp-' + el.id).innerText = 0;
    });
    gen();
    closeModal();
}

function doKopi() {
    var txt = getLaporan();
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(txt).then(showToast);
    } else {
        // Fallback context specifically requested for iframes
        var textArea = document.createElement("textarea");
        textArea.value = txt;
        document.body.appendChild(textArea);
        textArea.select();
        try { document.execCommand('copy'); showToast(); } catch (err) {}
        document.body.removeChild(textArea);
    }
}

function showToast() {
    var toast = document.getElementById('toastNotif');
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

function doWA() {
    var enc = encodeURIComponent(getLaporan());
    window.open('https://wa.me/?text=' + enc, '_blank');
}

initDate();
gen();
syncNow();
setInterval(syncNow, 1000); 

setInterval(function() {
    var s2 = document.getElementById('s2');
    var newShift = getCurrentShift();
    if (s2.value !== newShift && !dateManuallySet) {
        setShifts();
        gen();
    }
}, 300000); // 5 minute intervals shift checking
</script>
</body>
</html>
